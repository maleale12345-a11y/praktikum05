<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Box</title>
  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Jendela browser */
.browser {
  width: 90%;
  max-width: 700px;
  background: #fff;
  border: 1px solid #999;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
}

.titlebar {
  background: #e4e4e4;
  text-align: center;
  padding: 8px;
  font-size: 13px;
  border-bottom: 1px solid #ccc;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #e4e4e4;
  padding: 8px 12px;
  border-bottom: 1px solid #ccc;
}

.nav {
  font-weight: bold;
  letter-spacing: 4px;
}

.address {
  flex: 1;
  background: #fff;
  border: 1px solid #999;
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 13px;
  color: #1a6fd4;
}

/* Isi halaman */
.page {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
}

.box {
  border: 1px solid #555;
  border-radius: 8px;
}

.header {
  height: 60px;
  background: #a8e6b0;
}

.row {
  display: flex;
  gap: 14px;
}

.small {
  width: 90px;
  height: 90px;
  flex-shrink: 0;
}

.large {
  flex: 1;
  height: 90px;
}

.yellow { background: #ffe066; }
.orange { background: #ff7b4a; }
.blue   { background: #5ccfff; }

/* Responsif */
@media (max-width: 480px) {
  .small { width: 60px; }
}
  </style>
</head>
<body>
  <div class="browser">
    <div class="titlebar">Moqzilla</div>

    <div class="toolbar">
      <span class="nav">&#8592; &#8594; &#8635;</span>
      <div class="address">http://box2.com</div>
    </div>

    <div class="page">
      <div class="box header"></div>

      <div class="row">
        <div class="box small yellow"></div>
        <div class="box large orange"></div>
      </div>

      <div class="row">
        <div class="box small yellow"></div>
        <div class="box large blue"></div>
      </div>
    </div>
  </div>
</body>
</html>
