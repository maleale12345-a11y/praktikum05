<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Box 2</title>
  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.browser {
  width: 90%;
  max-width: 700px;
  background: #fff;
  border: 1px solid #888;
}

.titlebar {
  background: #e4e4e4;
  text-align: center;
  padding: 7px;
  font-size: 13px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #e4e4e4;
  padding: 6px 10px;
  border-bottom: 1px solid #ccc;
}

.nav {
  font-weight: bold;
  letter-spacing: 4px;
}

.address {
  flex: 1;
  background: #fff;
  border: 1px solid #888;
  padding: 4px 8px;
  font-size: 13px;
  color: #1a6fd4;
}

.page {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
}

.box {
  border: 1px solid #444;
  border-radius: 4px;
}

/* Baris atas */
.top {
  display: flex;
  gap: 10px;
}

.logo {
  width: 90px;
  height: 36px;
  background: #ffd84d;
}

.menu {
  flex: 1;
  height: 36px;
  background: #ff8040;
}

/* Baris tengah */
.middle {
  display: flex;
  gap: 10px;
  height: 260px;
}

.left {
  width: 90px;
  background: #a5d98f;
}

.content {
  flex: 1;
  background: #d0d5da;
}

.right {
  width: 90px;
  background: #55c8f0;
}

/* Footer */
.footer {
  height: 36px;
  background: #2f6fe0;
}
  </style>
</head>
<body>
  <div class="browser">
    <div class="titlebar">Moqzilla</div>

    <div class="toolbar">
      <span class="nav">&#8592; &#8594; &#8635;</span>
      <div class="address">http://box3.com</div>
    </div>

    <div class="page">
      <div class="top">
        <div class="box logo"></div>
        <div class="box menu"></div>
      </div>

      <div class="middle">
        <div class="box left"></div>
        <div class="box content"></div>
        <div class="box right"></div>
      </div>

      <div class="box footer"></div>
    </div>
  </div>
</body>
</html>
