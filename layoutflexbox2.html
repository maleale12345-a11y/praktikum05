<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Flexbox 2</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  color: white;
}

/* Wadah utama berwarna salmon, semua bagian ditumpuk vertikal */
.container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 100vh;
  padding: 10px;
  background-color: #ffa8a8;
}

header,
footer {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 45px;
  background-color: #99d5c9;
}

/* Baris tengah: Aside + Article berdampingan */
.content {
  flex: 1;
  display: flex;
  flex-direction: row;
  gap: 10px;
}

aside {
  width: 22%;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #5fb3b3;
}

article {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  padding: 15px;
  background-color: #ff7b7b;
}

article h2 {
  font-size: 14px;
  font-weight: normal;
}

/* Tiga gambar berjajar dalam Article */
.images {
  display: flex;
  flex-direction: row;
  gap: 12px;
}

.image {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 55px;
  height: 45px;
  background-color: #d3d3d3;
  font-size: 12px;
}

@media (max-width: 600px) {
  .content {
    flex-direction: column;
  }

  aside {
    width: 100%;
    height: 80px;
  }
}
  </style>
    
</head>
<body>
  <div class="container">
    <header>Header</header>

    <div class="content">
      <aside>Aside</aside>

      <article>
        <h2>Article</h2>
        <div class="images">
          <div class="image">Image</div>
          <div class="image">Image</div>
          <div class="image">Image</div>
        </div>
      </article>
    </div>

    <footer>Footer</footer>
  </div>
</body>
</html>
